name: Rotate private production QA passwords

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-qa-password-rotation
  cancel-in-progress: false

jobs:
  rotate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Require private production QA credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$E2E_PASSWORD"
          test "${#E2E_PASSWORD}" -ge 12

      - name: Rotate only allowlisted RewardMe QA identities
        env:
          QA_PASSWORD_ONLY: 'true'
          QA_VERIFY_LOGIN: 'true'
        run: npm run qa:reset-passwords

      - name: Rotate and refresh the isolated Wondertown identities
        run: npm run qa:provision-wondertown

      - name: Verify private logins, roles, memberships, and tenant isolation
        run: npm run qa:verify-reward-sites
