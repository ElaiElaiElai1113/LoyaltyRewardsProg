name: Promote permanent RewardMe account labels

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rewardme-permanent-account-labels
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require production database credentials
        shell: bash
        run: test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Promote permanent account and catalog labels
        run: npm run ops:rewardme:promote-accounts
