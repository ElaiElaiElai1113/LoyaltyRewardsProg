name: Provision Loyality QA accounts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loyality-qa-accounts
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://bftuvmywtmpflizsomim.supabase.co
      VITE_SUPABASE_URL: https://bftuvmywtmpflizsomim.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.NEW_VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NEW_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Require Loyalty Platforms QA credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$E2E_PASSWORD"

      - name: Provision and verify Loyality accounts
        run: node scripts/provision-loyality-qa.mjs
