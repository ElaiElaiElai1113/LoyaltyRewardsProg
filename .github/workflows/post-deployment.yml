name: Post-deployment verification

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: HTTPS deployment origin
        required: true
        type: string
      tenant_domains:
        description: Comma-separated tenant domains
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Deployment smoke
        run: npm run ops:smoke -- "${{ inputs.deployment_url }}"
      - name: Health contract and SPA routing
        run: npm run ops:health:diagnose -- "${{ inputs.deployment_url }}"
      - name: Verify tenant domains
        if: inputs.tenant_domains != ''
        shell: bash
        run: |
          IFS=',' read -ra domains <<< "${{ inputs.tenant_domains }}"
          for domain in "${domains[@]}"; do
            npm run ops:domain:check -- "$(echo "$domain" | xargs)"
          done
