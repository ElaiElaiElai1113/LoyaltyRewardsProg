name: Post-deployment verification

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: HTTPS deployment origin
        required: true
        type: string
      tenant_domains:
        description: Optional comma-separated additional tenant domains
        required: false
        type: string
      expected_version:
        description: Optional Git commit SHA that every canonical domain must serve
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOYMENT_URL: ${{ inputs.deployment_url || vars.PRODUCTION_URL || github.event.deployment_status.environment_url }}
      EXPECTED_VERSION: ${{ inputs.expected_version || github.event.deployment.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser for rendered tenant metadata checks
        run: npx playwright install --with-deps chromium
      - name: Deployment smoke
        run: npm run ops:smoke -- "$DEPLOYMENT_URL"
      - name: Health contract and SPA routing
        run: npm run ops:health:diagnose -- "$DEPLOYMENT_URL"
      - name: Verify canonical tenant domains
        run: |
          npm run ops:domain:check -- "pinas-rewards.vercel.app" "Pinas Rewards" --expected-version "$EXPECTED_VERSION"
          npm run ops:domain:check -- "www.medellinrewards.com" "Medellin Rewards" --expected-version "$EXPECTED_VERSION"
          npm run ops:domain:check -- "guatemalarewards.com" "Guatemala Rewards" --expected-version "$EXPECTED_VERSION"
      - name: Verify additional tenant domains
        if: inputs.tenant_domains != ''
        shell: bash
        run: |
          IFS=',' read -ra domains <<< "${{ inputs.tenant_domains }}"
          for domain in "${domains[@]}"; do
            npm run ops:domain:check -- "$(echo "$domain" | xargs)" --expected-version "$EXPECTED_VERSION"
          done
