name: Deploy Loyality production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/loyality-production.yml'
      - 'api/**'
      - 'public/**'
      - 'src/**'
      - 'index.html'
      - 'package-lock.json'
      - 'package.json'
      - 'tsconfig*.json'
      - 'vercel.json'

permissions:
  contents: read

concurrency:
  group: loyality-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOYALITY_SUPABASE_URL: https://bftuvmywtmpflizsomim.supabase.co
      VERCEL_ORG: elaielaielai1113s-projects
      VERCEL_PROJECT: loyality-rewards
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify the Loyalty Platforms connection
        env:
          LOYALITY_SUPABASE_ANON_KEY: ${{ secrets.NEW_VITE_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LOYALITY_SUPABASE_ANON_KEY"
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "apikey: $LOYALITY_SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $LOYALITY_SUPABASE_ANON_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"p_hostname":"loyality-rewards.vercel.app"}' \
            "$LOYALITY_SUPABASE_URL/rest/v1/rpc/resolve_program_by_hostname")"
          node -e "const rows=JSON.parse(process.argv[1]); if(!Array.isArray(rows)||rows[0]?.slug!=='loyality') process.exit(1)" "$response"

      - name: Test and build Loyality
        env:
          VITE_SUPABASE_URL: ${{ env.LOYALITY_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.NEW_VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit
          npm run build
          npm run build:budget

      - name: Configure Loyality production
        env:
          LOYALITY_SUPABASE_ANON_KEY: ${{ secrets.NEW_VITE_SUPABASE_ANON_KEY }}
          LOYALITY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NEW_SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LOYALITY_SUPABASE_SERVICE_ROLE_KEY"
          printf '%s' "$LOYALITY_SUPABASE_URL" | npx vercel env add VITE_SUPABASE_URL production --force --yes --no-sensitive --visibility config \
            --project "$VERCEL_PROJECT" --scope "$VERCEL_ORG" --token "$VERCEL_TOKEN"
          printf '%s' "$LOYALITY_SUPABASE_ANON_KEY" | npx vercel env add VITE_SUPABASE_ANON_KEY production --force --yes --no-sensitive --visibility config \
            --project "$VERCEL_PROJECT" --scope "$VERCEL_ORG" --token "$VERCEL_TOKEN"
          printf '%s' "$LOYALITY_SUPABASE_SERVICE_ROLE_KEY" | npx vercel env add SUPABASE_SERVICE_ROLE_KEY production --sensitive --force --yes \
            --project "$VERCEL_PROJECT" --scope "$VERCEL_ORG" --token "$VERCEL_TOKEN"

      - name: Deploy Loyality
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy . --prod --yes --archive=tgz --project "$VERCEL_PROJECT" --scope "$VERCEL_ORG" --token "$VERCEL_TOKEN"

      - name: Verify production is live
        env:
          LOYALITY_SUPABASE_ANON_KEY: ${{ secrets.NEW_VITE_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            status="$(curl --silent --output /tmp/loyality-home.html --write-out '%{http_code}' https://loyality-rewards.vercel.app/)"
            if [ "$status" = "200" ] && grep -q 'id="root"' /tmp/loyality-home.html; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "Loyality production verification failed."
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error \
            --request POST \
            --header "apikey: $LOYALITY_SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $LOYALITY_SUPABASE_ANON_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"p_hostname":"loyality-rewards.vercel.app"}' \
            "$LOYALITY_SUPABASE_URL/rest/v1/rpc/resolve_program_by_hostname" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const rows=JSON.parse(s);if(!Array.isArray(rows)||rows[0]?.slug!=='loyality')process.exit(1)})"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"referralCode":"__DEPLOYMENT_INVALID_CODE__","programId":"10000000-0000-4000-8000-000000000007","businessId":null,"kind":"member"}' \
            https://loyality-rewards.vercel.app/api/validate-referral \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const result=JSON.parse(s);if(result.valid!==false||result.error)process.exit(1)})"
