name: Production operations

on:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    if: github.event.schedule != '43 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check production tenants and health endpoints
        env:
          MONITOR_ORIGINS: ${{ vars.MONITOR_ORIGINS }}
        run: npm run ops:monitor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-monitoring-${{ github.run_id }}
          path: artifacts/monitoring
          retention-days: 30

  backup:
    if: github.event.schedule == '43 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: retfuxpfstatpdsunkgj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require backup credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_DB_PASSWORD"
      - name: Link project
        run: npx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Create logical backup
        run: |
          mkdir -p backups
          npx supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --file "backups/rewards-${GITHUB_RUN_ID}.sql"
          sha256sum "backups/rewards-${GITHUB_RUN_ID}.sql" > "backups/rewards-${GITHUB_RUN_ID}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-at-rest-database-backup-${{ github.run_id }}
          path: backups
          retention-days: 14
          if-no-files-found: error
