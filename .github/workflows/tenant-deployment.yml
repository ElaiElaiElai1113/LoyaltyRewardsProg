name: Tenant deployment synchronization

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full Git commit SHA to deploy; defaults to the selected branch commit
        required: false
        type: string
      legacy_tenant_sync:
        description: Run legacy multi-tenant deployment, alias synchronization and server-secret refresh
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: coffee-production-publish
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}
      VERCEL_SCOPE: elaielaielai1113s-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Require deployment credentials
        shell: bash
        run: |
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          test -n "$VERCEL_TOKEN"

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.7.1

      - name: Check publication scope contracts before external operations
        run: node --test scripts/deployment-workflows.test.mjs scripts/publish-reviewed-site.test.mjs

      - name: Synchronize RewardMe production server secret
        if: github.event_name == 'workflow_dispatch' && inputs.legacy_tenant_sync == true
        shell: bash
        env:
          REWARDME_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$REWARDME_SUPABASE_SERVICE_ROLE_KEY"
          printf '%s' "$REWARDME_SUPABASE_SERVICE_ROLE_KEY" |
            vercel env add SUPABASE_SERVICE_ROLE_KEY production --sensitive --force \
              --project loyalty-rewards-prog \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"

      - name: Confirm RewardMe production server variables
        run: >-
          vercel env ls production --json
          --project loyalty-rewards-prog
          --scope "$VERCEL_SCOPE"
          --token "$VERCEL_TOKEN"
          | node scripts/audit-vercel-environment.mjs

      - name: Deploy exact validated RewardMe commit with current server variables
        run: node scripts/publish-reviewed-site.mjs rewardme "$EXPECTED_COMMIT_SHA" artifacts/deployment/rewardme.json

      - name: Synchronize tenant deployments
        if: github.event_name == 'workflow_dispatch' && inputs.legacy_tenant_sync == true
        run: npm run ops:deploy:tenants -- --sha "$EXPECTED_COMMIT_SHA" --output artifacts/deployment/tenant-sync.json

      - name: Require direct RewardMe application and worker responses
        shell: bash
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' 'https://rewardme-prod.vercel.app/signin?tenant=rewardme')" = '200'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' 'https://rewardme-prod.vercel.app/sw.js')" = '200'

      - name: Install browser for canonical domain verification
        run: npx playwright install --with-deps chromium

      - name: Verify RewardMe production domains
        shell: bash
        env:
          DOMAIN_VERSION_RETRY_ATTEMPTS: '6'
          DOMAIN_VERSION_RETRY_DELAY_MS: '10000'
        run: |
          status=0
          npm run ops:domain:check -- "myrewardme.com" "RewardMe" --expected-version "$EXPECTED_COMMIT_SHA" || status=1
          npm run ops:domain:check -- "www.myrewardme.com" "RewardMe" --expected-version "$EXPECTED_COMMIT_SHA" || status=1
          npm run ops:domain:check -- "loyalty-rewards-prog.vercel.app" "RewardMe" --expected-version "$EXPECTED_COMMIT_SHA" || status=1
          npm run ops:domain:check -- "rewardme-prod.vercel.app" "RewardMe" --expected-version "$EXPECTED_COMMIT_SHA" || status=1
          npm run ops:domain:check -- "reward-me-prog.vercel.app" "RewardMe" --expected-version "$EXPECTED_COMMIT_SHA" || status=1
          exit "$status"

      - name: Verify legacy canonical tenant domains
        if: github.event_name == 'workflow_dispatch' && inputs.legacy_tenant_sync == true
        shell: bash
        env:
          DOMAIN_VERSION_RETRY_ATTEMPTS: '6'
          DOMAIN_VERSION_RETRY_DELAY_MS: '10000'
        run: |
          status=0
          npm run ops:domain:check -- "www.medellinrewards.com" "Medellin Rewards" --expected-version "$EXPECTED_COMMIT_SHA" || status=1
          npm run ops:domain:check -- "guatemalarewards.com" "Guatemala Rewards" --expected-version "$EXPECTED_COMMIT_SHA" || status=1
          npm run ops:domain:check -- "rewardme-prod.vercel.app" "RewardMe" --expected-version "$EXPECTED_COMMIT_SHA" || status=1
          npm run ops:domain:check -- "pinas-rewards.vercel.app" "Pinas Rewards" --expected-version "$EXPECTED_COMMIT_SHA" || status=1
          npm run ops:domain:check -- "wondertown-rewards.vercel.app" "Wondertown Rewards" --expected-version "$EXPECTED_COMMIT_SHA" || status=1
          exit "$status"

      - name: Upload deployment evidence
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tenant-deployment-${{ github.run_id }}
          path: artifacts/deployment/*.json
          if-no-files-found: warn
          retention-days: 30
