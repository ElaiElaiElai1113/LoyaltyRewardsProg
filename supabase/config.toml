# A string used to distinguish different Supabase projects on the same host
project_id = "medellinrewards"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5177"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://localhost:5177/**",
  "http://127.0.0.1:5177/**",
  "http://medellin.localhost:5177/**",
  "http://guatemala.localhost:5177/**",
  "http://pinas.localhost:5177/**",
  "http://synergize.localhost:5177/**",
  "http://wondertown.localhost:5177/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.sign-agreement]
verify_jwt = true

[functions.register-customer]
verify_jwt = true
